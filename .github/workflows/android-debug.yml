name: APK de depuración
on:
  workflow_dispatch: # solo manual: Actions → «APK de depuración» → Run workflow
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Dependencias, pruebas y build (los errores de TypeScript hacen fallar el build)
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build
      - name: Clave fija de la app (secreto de GitHub; si no está, se usa la de depuración)
        env:
          MC_KEYSTORE_B64: ${{ secrets.MC_KEYSTORE_B64 }}
          MC_KEYSTORE_PASS: ${{ secrets.MC_KEYSTORE_PASS }}
          MC_KEY_ALIAS: ${{ secrets.MC_KEY_ALIAS }}
        run: |
          if [ -n "$MC_KEYSTORE_B64" ]; then
            # se quitan espacios y saltos de línea que se cuelan al copiar desde el teléfono
            CLEAN=$(printf '%s' "$MC_KEYSTORE_B64" | tr -d ' \r\n\t')
            echo "Largo del secreto MC_KEYSTORE_B64: ${#CLEAN} caracteres (la clave de Mi Cancionero tiene 3568)"
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/mc.jks" 2>/dev/null; then
              echo "::error title=Clave fija::MC_KEYSTORE_B64 no se pudo leer (largo ${#CLEAN}, se esperaban 3568). Volvé a copiar la línea larga completa del archivo de secretos."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/mc.jks" -storepass "$MC_KEYSTORE_PASS" -alias "$MC_KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error title=Clave fija::La clave se leyó pero la contraseña (MC_KEYSTORE_PASS) o el alias (MC_KEY_ALIAS) no coinciden. Revisá que no tengan espacios de más."
              exit 1
            fi
            echo "MC_KEYSTORE=$RUNNER_TEMP/mc.jks" >> "$GITHUB_ENV"
            echo "Firma: clave fija (las versiones nuevas se instalan encima sin perder canciones)"
          else
            echo "::warning::Sin clave fija (secreto MC_KEYSTORE_B64): la APK se firma con una clave de depuración nueva y hay que desinstalar la anterior."
          fi
      - name: Generar proyecto Android
        working-directory: frontend
        run: |
          npx cap add android
          node scripts/android-patch.mjs
          npx cap sync android
      - name: Compilar APK
        working-directory: frontend/android
        env:
          MC_KEYSTORE_PASS: ${{ secrets.MC_KEYSTORE_PASS }}
          MC_KEY_ALIAS: ${{ secrets.MC_KEY_ALIAS }}
          MC_KEY_PASS: ${{ secrets.MC_KEYSTORE_PASS }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Verificar el paquete APK
        run: |
          set -e
          APK=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk.txt
          for f in AndroidManifest.xml classes.dex assets/public/index.html; do grep -q "$f" /tmp/apk.txt || { echo "Falta $f en la APK"; exit 1; }; done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt
          grep -q "package: name='app.guitarchords'" /tmp/badging.txt
          grep -q "application-label:'Mi Cancionero'" /tmp/badging.txt || { echo "El nombre visible no es Mi Cancionero"; grep application-label /tmp/badging.txt; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q "android.intent.action.SEND" || { echo "Falta compartir (SEND) en el manifiesto"; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified|SHA-256|DN" || true
          "$BT/apksigner" verify "$APK"
          ls -l "$APK"
      - name: Verificar que la APK lleva el mismo motor que la web (huellas SHA-256)
        run: |
          set -e
          APK=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/public/engine-manifest.json > /tmp/m.json
          python3 - <<'PY'
          import json, subprocess, hashlib, sys
          apk = 'frontend/android/app/build/outputs/apk/debug/app-debug.apk'
          m = json.load(open('/tmp/m.json')); bad = 0
          web = json.load(open('frontend/dist/engine-manifest.json'))
          for f, v in m['files'].items():
              b = subprocess.run(['unzip', '-p', apk, 'assets/public/' + f], capture_output=True).stdout
              h = hashlib.sha256(b).hexdigest()[:16]
              ok = h == v['sha256'] == web['files'].get(f, {}).get('sha256')
              bad += not ok
              print(('OK ' if ok else 'DISTINTO ') + f, h, f"{len(b)/1e6:.2f} MB")
          print(f"Motor en la APK: {m['engineBytes']/1e6:.1f} MB")
          sys.exit(1 if bad else 0)
          PY
          du -h "$APK"
      - uses: actions/upload-artifact@v4
        with: { name: mi-cancionero-debug-apk, path: frontend/android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publicar en Releases (descarga directa desde el teléfono)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            --prerelease --title "APK de depuración" --notes "Compilada automáticamente desde ${{ github.sha }}. No probada en un dispositivo."
